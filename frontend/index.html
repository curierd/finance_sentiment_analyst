<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融评论情绪分析</title>
<style>
:root {
  --bg: #0f1117;
  --card-bg: #1a1d27;
  --card-hover: #21253a;
  --border: #2a2d3e;
  --text: #e0e3f0;
  --text-dim: #8890a8;
  --pos: #34d399;
  --neg: #f87171;
  --neu: #94a3b8;
  --pos-bg: rgba(52,211,153,0.12);
  --neg-bg: rgba(248,113,113,0.12);
  --neu-bg: rgba(148,163,184,0.12);
  --bili: #00a1d6;
  --xueqiu: #1aad19;
  --xiaohongshu: #ff6b6b;
  --accent: #6366f1;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
#app { display: flex; flex-direction: column; height: 100vh; }

header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 100; }
header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
.platform-tabs { display: flex; gap: 4px; }
.platform-tabs button { background: none; border: none; padding: 6px 14px; border-radius: 6px; font-size: 13px; color: var(--text-dim); cursor: pointer; transition: all 0.15s; }
.platform-tabs button:hover { background: var(--border); color: var(--text); }
.platform-tabs button.active { background: var(--accent); color: #fff; }
.header-spacer { flex: 1; }
.stats-bar { display: flex; gap: 14px; font-size: 12px; color: var(--text-dim); align-items: center; }

.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 240px; background: var(--card-bg); border-right: 1px solid var(--border); padding: 16px; overflow-y: auto; flex-shrink: 0; }
.sidebar h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); margin: 12px 0 8px; }
.sidebar input { width: 100%; padding: 7px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; outline: none; margin-bottom: 8px; }
.sidebar input:focus { border-color: var(--accent); }

.filter-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: none; color: var(--text-dim); font-size: 13px; cursor: pointer; transition: all 0.15s; text-align: left; margin-bottom: 4px; }
.filter-btn:hover { border-color: var(--accent); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.filter-btn.active.pos { background: var(--pos-bg); border-color: var(--pos); color: var(--pos); }
.filter-btn.active.neg { background: var(--neg-bg); border-color: var(--neg); color: var(--neg); }
.filter-btn.active.neu { background: var(--neu-bg); border-color: var(--neu); color: var(--neu); }
.filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.filter-dot.pos { background: var(--pos); }
.filter-dot.neg { background: var(--neg); }
.filter-dot.neu { background: var(--neu); }
.filter-dot.all { background: var(--accent); }
.filter-dot.gray { background: var(--text-dim); }

.main { flex: 1; overflow-y: auto; padding: 16px; }
.comments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }

.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; transition: all 0.15s; width: 100%; height: 240px; display: flex; flex-direction: column; cursor: pointer; overflow: hidden; }
.card:hover { border-color: var(--accent); background: var(--card-hover); }
.card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-shrink: 0; }
.platform-badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.platform-badge.bilibili { background: rgba(0,161,214,0.2); color: var(--bili); }
.platform-badge.xueqiu { background: rgba(26,173,25,0.2); color: var(--xueqiu); }
.platform-badge.xiaohongshu { background: rgba(255,107,107,0.2); color: var(--xiaohongshu); }
.card-author { font-size: 12px; color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-likes { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.card-likes svg { width: 12px; height: 12px; fill: var(--text-dim); }
.card-content { font-size: 14px; line-height: 1.5; color: var(--text); margin: 8px 0; word-break: break-word; flex: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.card-meta { font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
.card-meta span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-image-indicator { margin-top: 6px; font-size: 11px; color: var(--accent); display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.card-image-indicator svg { width: 14px; height: 14px; }
.card-meta-muted { opacity: 0.6; font-style: italic; }

.sentiment-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sentiment-badge { display: flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.sentiment-badge.pos { background: var(--pos-bg); color: var(--pos); }
.sentiment-badge.neg { background: var(--neg-bg); color: var(--neg); }
.sentiment-badge.neu { background: var(--neu-bg); color: var(--neu); }
.locked-badge { display: flex; align-items: center; gap: 3px; font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--accent); color: #fff; }
.locked-badge svg { width: 10px; height: 10px; fill: #fff; }

.sentiment-selector { display: flex; gap: 4px; margin-left: auto; }
.sentiment-selector button { padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: none; font-size: 12px; cursor: pointer; transition: all 0.15s; }
.sentiment-selector button.pos:hover, .sentiment-selector button.pos.selected { background: var(--pos-bg); border-color: var(--pos); color: var(--pos); }
.sentiment-selector button.neg:hover, .sentiment-selector button.neg.selected { background: var(--neg-bg); border-color: var(--neg); color: var(--neg); }
.sentiment-selector button.neu:hover, .sentiment-selector button.neu.selected { background: var(--neu-bg); border-color: var(--neu); color: var(--neu); }
.unlock-btn { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: none; font-size: 11px; color: var(--text-dim); cursor: pointer; margin-left: 4px; }
.unlock-btn:hover { color: var(--text); border-color: var(--accent); }

.pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; padding-bottom: 20px; }
.pagination button { padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--card-bg); color: var(--text); cursor: pointer; font-size: 13px; }
.pagination button:hover:not(:disabled) { border-color: var(--accent); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
.page-info { font-size: 13px; color: var(--text-dim); }

.stats-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; display: none; }
.stats-panel.visible { display: block; }
.stats-panel h3 { font-size: 13px; color: var(--text); margin-bottom: 12px; font-weight: 600; }
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stats-section { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.stats-section h4 { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 6px; }
.stat-row:last-child { margin-bottom: 0; }
.stat-label { display: flex; align-items: center; gap: 6px; color: var(--text-dim); }
.stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.stat-value { font-weight: 600; }
.bar-track { height: 6px; background: var(--border); border-radius: 3px; margin-top: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.bar-fill.pos { background: var(--pos); }
.bar-fill.neg { background: var(--neg); }
.bar-fill.neu { background: var(--neu); }
.percent-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.weighted-section { margin-top: 12px; }
.weighted-bar { height: 24px; display: flex; border-radius: 6px; overflow: hidden; margin-top: 6px; }
.weighted-segment { display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; transition: width 0.4s ease; }
.platform-breakdown { display: flex; flex-direction: column; gap: 8px; }
.platform-stat { display: flex; align-items: center; gap: 8px; }
.platform-stat-name { font-size: 12px; width: 50px; flex-shrink: 0; }
.platform-stat-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.platform-stat-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }
.platform-stat-count { font-size: 12px; color: var(--text-dim); width: 40px; text-align: right; }

.timeline-section { margin-top: 12px; }
.timeline-controls { display: flex; gap: 6px; margin-bottom: 10px; }
.timeline-controls button { padding: 3px 10px; border-radius: 4px; border: 1px solid var(--border); background: none; font-size: 11px; color: var(--text-dim); cursor: pointer; }
.timeline-controls button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.timeline-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; padding-bottom: 20px; position: relative; }
.timeline-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0; height: 100%; position: relative; }
.timeline-bar { width: 100%; display: flex; flex-direction: column; border-radius: 3px 3px 0 0; overflow: hidden; position: absolute; bottom: 0; min-height: 2px; }
.timeline-seg { width: 100%; transition: height 0.3s ease; }
.timeline-seg.pos { background: var(--pos); }
.timeline-seg.neu { background: var(--neu); }
.timeline-seg.neg { background: var(--neg); }
.timeline-label { font-size: 10px; color: var(--text-dim); text-align: center; position: absolute; bottom: -18px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timeline-tooltip { position: absolute; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 11px; color: var(--text); pointer-events: none; z-index: 10; white-space: nowrap; display: none; line-height: 1.6; }
.timeline-legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--text-dim); justify-content: center; }
.timeline-legend-item { display: flex; align-items: center; gap: 4px; }
.timeline-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

.loading { text-align: center; padding: 40px; color: var(--text-dim); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty { text-align: center; padding: 60px; color: var(--text-dim); font-size: 14px; }

.chart-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
.chart-modal.open { display: flex; }
.chart-modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 90vw; max-height: 90vh; overflow: auto; position: relative; }
.chart-modal-close { position: absolute; top: 10px; right: 14px; background: none; border: none; font-size: 20px; color: var(--text-dim); cursor: pointer; line-height: 1; }
.chart-modal-close:hover { color: var(--text); }
.chart-modal-img { display: block; max-width: 100%; border-radius: 6px; }
.chart-modal-title { text-align: center; font-size: 14px; color: var(--text-dim); margin-bottom: 12px; }

.confirm-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1100; }
.confirm-modal.open { display: flex; }
.confirm-modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; min-width: 320px; max-width: 90vw; }
.confirm-modal-title { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 10px; }
.confirm-modal-text { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 18px; word-break: break-word; max-height: 120px; overflow-y: auto; }
.confirm-modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.confirm-btn { padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.confirm-btn-cancel { background: none; border: 1px solid var(--border); color: var(--text-dim); }
.confirm-btn-cancel:hover { border-color: var(--accent); color: var(--text); }
.confirm-btn-ok { background: var(--neg); border: 1px solid var(--neg); color: #fff; }
.confirm-btn-ok:hover { opacity: 0.85; }
.confirm-btn-ok:disabled { opacity: 0.5; cursor: not-allowed; }

.card-delete { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 3px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; margin-left: 6px; }
.card-delete:hover { color: var(--neg); border-color: var(--neg); }

.analyze-btn { background: var(--accent); border-color: var(--accent); color: #fff; justify-content: center; font-weight: 600; }
.analyze-btn:hover { opacity: 0.85; color: #fff; }
.analyze-btn.loading { opacity: 0.6; pointer-events: none; }
.analyze-result-title { font-weight: 600; color: var(--text); margin-bottom: 6px; }
.analyze-result-row { display: flex; justify-content: space-between; align-items: center; }
.analyze-result-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 4px; }
.analyze-mini-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 2px 0 6px; overflow: hidden; display: flex; }
.analyze-mini-seg { height: 100%; }

.datepicker-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1200; }
.datepicker-modal.open { display: flex; }
.datepicker-modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 0; max-width: 640px; width: 94vw; overflow: hidden; }
.datepicker-header { font-size: 14px; font-weight: 600; color: var(--text); padding: 14px 16px; border-bottom: 1px solid var(--border); }
.datepicker-cols { display: flex; gap: 0; }
.datepicker-col { flex: 1; padding: 12px; border-right: 1px solid var(--border); }
.datepicker-col:last-child { border-right: none; }
.datepicker-col-label { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 8px; text-align: center; }
.datepicker-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.datepicker-nav-btn { background: none; border: 1px solid var(--border); border-radius: 4px; color: var(--text-dim); cursor: pointer; padding: 2px 8px; font-size: 13px; transition: all 0.15s; }
.datepicker-nav-btn:hover { border-color: var(--accent); color: var(--text); }
.datepicker-nav-month { font-size: 13px; font-weight: 600; color: var(--text); }
.datepicker-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
.datepicker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
.datepicker-day { background: none; border: none; border-radius: 4px; padding: 4px 0; font-size: 12px; color: var(--text); cursor: pointer; text-align: center; transition: all 0.1s; }
.datepicker-day:hover { background: var(--border); }
.datepicker-day.other { color: var(--text-dim); opacity: 0.4; }
.datepicker-day.selected { background: var(--accent); color: #fff; font-weight: 600; }
.datepicker-day.today { outline: 1px solid var(--accent); outline-offset: -1px; }
.datepicker-time { display: flex; align-items: center; gap: 4px; margin-top: 8px; justify-content: center; }
.datepicker-time select { padding: 4px 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 13px; outline: none; cursor: pointer; }
.datepicker-time select:focus { border-color: var(--accent); }
.datepicker-time-sep { color: var(--text-dim); font-size: 13px; }
.datepicker-actions { display: flex; gap: 6px; justify-content: flex-end; padding: 10px 16px 14px; border-top: 1px solid var(--border); }
.datepicker-btn { padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.datepicker-btn-clear { background: none; border: 1px solid var(--border); color: var(--text-dim); }
.datepicker-btn-clear:hover { border-color: var(--neg); color: var(--neg); }
.datepicker-btn-cancel { background: none; border: 1px solid var(--border); color: var(--text-dim); }
.datepicker-btn-cancel:hover { border-color: var(--accent); color: var(--text); }
.datepicker-btn-ok { background: var(--accent); border: 1px solid var(--accent); color: #fff; }
.datepicker-btn-ok:hover { opacity: 0.85; }

/* Comment detail modal */
.detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 1300; padding: 20px; }
.detail-modal.open { display: flex; }
.detail-modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; max-width: 700px; width: 100%; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; }
.detail-modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.detail-modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
.detail-modal-close { background: none; border: none; font-size: 24px; color: var(--text-dim); cursor: pointer; line-height: 1; padding: 0; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
.detail-modal-close:hover { color: var(--text); }
.detail-modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.detail-content { font-size: 15px; line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-word; margin-bottom: 16px; }
.detail-image { max-width: 100%; border-radius: 8px; margin-bottom: 16px; border: 1px solid var(--border); }
.detail-meta { background: var(--bg); border-radius: 8px; padding: 14px; font-size: 13px; color: var(--text-dim); }
.detail-meta-row { display: flex; margin-bottom: 8px; }
.detail-meta-row:last-child { margin-bottom: 0; }
.detail-meta-label { width: 70px; flex-shrink: 0; color: var(--text-dim); }
.detail-meta-value { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.detail-modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>金融评论情绪分析</h1>
    <div class="platform-tabs">
      <button class="active" data-platform="">全部</button>
      <button data-platform="bilibili">B站</button>
      <button data-platform="xueqiu">雪球</button>
      <button data-platform="xiaohongshu">小红书</button>
    </div>
    <div class="header-spacer"></div>
    <button id="statsToggle" onclick="toggleStatsPanel()" style="background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:12px;color:var(--text-dim);cursor:pointer;">📊 统计</button>
    <div class="stats-bar" id="statsBar"><span>加载中...</span></div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h3>来源</h3>
      <button class="filter-btn active" data-locked="" onclick="setLockedFilter('')">
        <span class="filter-dot all"></span> 全部
      </button>
      <button class="filter-btn" data-locked="0" onclick="setLockedFilter('0')">
        <span class="filter-dot gray"></span> 自动分析
      </button>
      <button class="filter-btn" data-locked="1" onclick="setLockedFilter('1')">
        <span class="filter-dot all"></span> 已锁定
      </button>

      <h3>搜索</h3>
      <input type="text" id="authorFilter" placeholder="作者 / UP主">
      <input type="text" id="videoFilter" placeholder="视频 / 帖子标题">

      <h3>情绪</h3>
      <button class="filter-btn active all" data-sentiment="" onclick="setSentimentFilter('')">
        <span class="filter-dot all"></span> 全部
      </button>
      <button class="filter-btn" data-sentiment="正面" onclick="setSentimentFilter('正面')">
        <span class="filter-dot pos"></span> 正面
      </button>
      <button class="filter-btn" data-sentiment="中性" onclick="setSentimentFilter('中性')">
        <span class="filter-dot neu"></span> 中性
      </button>
      <button class="filter-btn" data-sentiment="负面" onclick="setSentimentFilter('负面')">
        <span class="filter-dot neg"></span> 负面
      </button>

      <h3>点赞数 &gt;</h3>
      <input type="number" id="likesFilter" placeholder="0" min="0">

      <h3>时间范围</h3>
      <button class="filter-btn" id="dateRangeBtn" onclick="openDatePicker()">
        <span class="filter-dot all"></span> <span id="dateRangeLabel">全部时间</span>
      </button>

      <h3>批量操作</h3>
      <button class="filter-btn analyze-btn" id="analyzeBtn" onclick="analyzeSentiment()">
        <span id="analyzeBtnText">🔄 重新分析</span>
      </button>
      <div style="font-size:11px;color:var(--text-dim);margin:4px 0 0 4px;" id="analyzeHint">可分析 <span id="analyzeCount">-</span> 条</div>
      <div id="analyzeResult" style="display:none;margin-top:8px;background:var(--bg);border-radius:6px;padding:10px;font-size:12px;line-height:1.6;"></div>
    </aside>

    <main class="main">
      <div class="stats-panel" id="statsPanel">
        <h3>📊 情绪统计详情</h3>
        <div class="stats-grid">
          <div class="stats-section">
            <h4>情绪分布（全部）</h4>
            <div class="stat-row"><span class="stat-label"><span class="stat-dot" style="background:var(--pos)"></span>正面</span><span class="stat-value" style="color:var(--pos)" id="statPos">-</span></div>
            <div class="stat-row"><span class="stat-label"><span class="stat-dot" style="background:var(--neu)"></span>中性</span><span class="stat-value" style="color:var(--neu)" id="statNeu">-</span></div>
            <div class="stat-row"><span class="stat-label"><span class="stat-dot" style="background:var(--neg)"></span>负面</span><span class="stat-value" style="color:var(--neg)" id="statNeg">-</span></div>
           <div class="bar-track"><div class="bar-fill pos" id="statPosBar" style="width:0%"></div></div>
            <div class="bar-track"><div class="bar-fill neu" id="statNeuBar" style="width:0%"></div></div>
            <div class="bar-track"><div class="bar-fill neg" id="statNegBar" style="width:0%"></div></div>
           <div class="percent-row"><span>占比</span><span id="statTotalCnt"></span></div>
          </div>
          <div class="stats-section">
            <h4>点赞加权情绪</h4>
            <div class="weighted-bar" id="weightedBar">
              <div class="weighted-segment" id="weightedPos" style="width:0%;background:var(--pos)">0%</div>
              <div class="weighted-segment" id="weightedNeu" style="width:0%;background:var(--neu)">0%</div>
              <div class="weighted-segment" id="weightedNeg" style="width:0%;background:var(--neg)">0%</div>
            </div>
            <div class="weighted-section">
              <div class="stat-row"><span class="stat-label"><span class="stat-dot" style="background:var(--pos)"></span>正面加权</span><span class="stat-value" style="color:var(--pos)" id="weightedPosVal">-</span></div>
              <div class="stat-row"><span class="stat-label"><span class="stat-dot" style="background:var(--neu)"></span>中性加权</span><span class="stat-value" style="color:var(--neu)" id="weightedNeuVal">-</span></div>
              <div class="stat-row"><span class="stat-label"><span class="stat-dot" style="background:var(--neg)"></span>负面加权</span><span class="stat-value" style="color:var(--neg)" id="weightedNegVal">-</span></div>
            </div>
          </div>
          <div class="stats-section">
            <h4>平台分布</h4>
            <div class="platform-breakdown" id="platformBreakdown"></div>
          </div>
          <div class="stats-section">
            <h4>情绪时间线</h4>
            <div class="timeline-controls" id="timelineControls">
              <button class="active" data-g="day" onclick="setTimelineGranularity('day')">日</button>
              <button data-g="week" onclick="setTimelineGranularity('week')">周</button>
              <button data-g="month" onclick="setTimelineGranularity('month')">月</button>
            </div>
            <div id="timelineChart" style="min-height:80px;cursor:pointer;" onclick="openChartModal()"></div>
            <div style="font-size:10px;color:var(--text-dim);text-align:center;margin-top:4px;">点击查看大图</div>
            <div class="timeline-legend">
              <div class="timeline-legend-item"><div class="timeline-legend-dot" style="background:var(--pos)"></div><span>正面</span></div>
              <div class="timeline-legend-item"><div class="timeline-legend-dot" style="background:var(--neu)"></div><span>中性</span></div>
              <div class="timeline-legend-item"><div class="timeline-legend-dot" style="background:var(--neg)"></div><span>负面</span></div>
            </div>
          </div>
        </div>
      </div>
       <div class="comments-grid" id="commentsGrid"></div>
      <div class="pagination" id="pagination"></div>
    </main>
  </div>
</div>

<script>
var API = '/api';
var state = {
  platform: '',
  sentiment: '',
  locked: '',
  author: '',
  video: '',
  page: 1,
  pageSize: 50,
  total: 0,
  pages: 0,
  dateFrom: '',
  dateTo: ''
};

var statsPanelVisible = false;
var timelineGranularity = 'day';
function toggleStatsPanel() {
  statsPanelVisible = !statsPanelVisible;
  var panel = document.getElementById('statsPanel');
  var btn = document.getElementById('statsToggle');
  if (statsPanelVisible) {
    panel.classList.add('visible');
    btn.style.borderColor = 'var(--accent)';
    btn.style.color = 'var(--text)';
    loadStatsPanel();
  } else {
    panel.classList.remove('visible');
    btn.style.borderColor = 'var(--border)';
    btn.style.color = 'var(--text-dim)';
  }
}

function setTimelineGranularity(g) {
  timelineGranularity = g;
  var btns = document.querySelectorAll('[data-g]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (btns[i].dataset.g === g) btns[i].classList.add('active');
  }
  loadTimeline();
}

var timelineImg = null;
function loadTimeline() {
  var container = document.getElementById('timelineChart');
  container.innerHTML = '<div id="timelineLoading" style="text-align:center;padding:20px;color:var(--text-dim);font-size:12px;">生成图表中...</div>';
  var t = timelineImg || document.createElement('img');
  t.id = 'timelineImg';
  t.style.cssText = 'width:100%;border-radius:6px;display:block;cursor:pointer;';
  t.alt = '点击查看大图';
  t.title = '点击查看大图';
  t.onload = function() { container.innerHTML = ''; container.appendChild(t); t.onclick = openChartModal; };
  t.onerror = function() { container.innerHTML = '<div style="font-size:12px;color:var(--neg);text-align:center;padding:20px">图表加载失败</div>'; };
  t.src = API + '/stats/timeline/image?granularity=' + timelineGranularity + '&' + buildStatsParams() + '&_=' + Date.now();
  timelineImg = t;
}

function openChartModal() {
  var modal = document.getElementById('chartModal');
  var img = document.getElementById('chartModalImg');
  var title = document.getElementById('chartModalTitle');
  var granLabel = { day: '日', week: '周', month: '月' };
  title.textContent = '情绪时间线（' + (granLabel[timelineGranularity] || timelineGranularity) + '）';
  img.src = API + '/stats/timeline/image?granularity=' + timelineGranularity + '&' + buildStatsParams() + '&_=' + Date.now();
  modal.classList.add('open');
}

function closeChartModal() {
  document.getElementById('chartModal').classList.remove('open');
}

function buildStatsParams() {
  return 'platform=' + encodeURIComponent(state.platform) +
    '&sentiment=' + encodeURIComponent(state.sentiment) +
    '&locked=' + encodeURIComponent(state.locked) +
    '&author=' + encodeURIComponent(state.author) +
    '&video_title=' + encodeURIComponent(state.video) +
    '&date_from=' + encodeURIComponent(state.dateFrom) +
    '&date_to=' + encodeURIComponent(state.dateTo);
}

function loadStats() {
  fetch(API + '/stats?' + buildStatsParams()).then(function(res) { return res.json(); }).then(function(data) {
    var auto = data.auto || {};
    var locked = data.locked || {};
    var ac = data.auto_count || 0;
    var lc = data.locked_count || 0;
    var total = ac + lc;
    document.getElementById('statsBar').innerHTML =
      '<span style="color:var(--pos)">正面 ' + ((auto['正面']||0)+(locked['正面']||0)) + '</span>' +
      '<span style="color:var(--neu)">中性 ' + ((auto['中性']||0)+(locked['中性']||0)) + '</span>' +
      '<span style="color:var(--neg)">负面 ' + ((auto['负面']||0)+(locked['负面']||0)) + '</span>' +
      '<span>|</span>' +
      '<span>自动 ' + ac + ' 条</span>' +
      '<span style="color:var(--accent)">锁定 ' + lc + ' 条</span>' +
      '<span>|</span><span>共 ' + total + ' 条</span>';
    document.getElementById('analyzeCount').textContent = ac;
  });
}

var analyzeRunning = false;
function analyzeSentiment() {
  if (analyzeRunning) return;
  var countEl = document.getElementById('analyzeCount');
  var ac = parseInt(countEl.textContent) || 0;
  if (ac === 0) {
    document.getElementById('analyzeResult').style.display = 'block';
    document.getElementById('analyzeResult').innerHTML = '<div style="color:var(--text-dim)">没有需要分析的评论（当前筛选条件下无可分析评论或全部已锁定）</div>';
    return;
  }
  if (!confirm('将对当前筛选条件下的 ' + ac + ' 条未锁定评论重新进行情绪分析，确定继续？')) return;

  analyzeRunning = true;
  var btn = document.getElementById('analyzeBtn');
  var btnText = document.getElementById('analyzeBtnText');
  btn.classList.add('loading');
  btnText.textContent = '分析中...';
  document.getElementById('analyzeResult').style.display = 'none';

  fetch(API + '/comments/analyze?' + buildStatsParams(), { method: 'POST' })
    .then(function(res) { return res.json(); })
    .then(function(data) {
      btn.classList.remove('loading');
      analyzeRunning = false;
      showAnalyzeResult(data);
      loadComments();
      refreshStatsIfVisible();
    })
    .catch(function(err) {
      btn.classList.remove('loading');
      analyzeRunning = false;
      btnText.textContent = '🔄 重新分析';
      document.getElementById('analyzeResult').style.display = 'block';
      document.getElementById('analyzeResult').innerHTML = '<div style="color:var(--neg)">分析失败: ' + err.message + '</div>';
    });
}

function showAnalyzeResult(data) {
  var btnText = document.getElementById('analyzeBtnText');
  btnText.textContent = '🔄 重新分析';
  var el = document.getElementById('analyzeResult');
  el.style.display = 'block';
  if (!data.stats) {
    el.innerHTML = '<div style="color:var(--text-dim)">没有需要分析的评论</div>';
    return;
  }
  var s = data.stats;
  var t = s.total || 0;
  var html = '<div class="analyze-result-title">分析完成</div>';
  html += '<div class="analyze-result-row"><span><span class="analyze-result-dot" style="background:var(--pos)"></span>正面</span><span style="color:var(--pos);font-weight:600">' + s.counts['正面'] + ' (' + s.pct['正面'] + '%)</span></div>';
  html += '<div class="analyze-result-row"><span><span class="analyze-result-dot" style="background:var(--neu)"></span>中性</span><span style="color:var(--neu);font-weight:600">' + s.counts['中性'] + ' (' + s.pct['中性'] + '%)</span></div>';
  html += '<div class="analyze-result-row"><span><span class="analyze-result-dot" style="background:var(--neg)"></span>负面</span><span style="color:var(--neg);font-weight:600">' + s.counts['负面'] + ' (' + s.pct['负面'] + '%)</span></div>';
  html += '<div class="analyze-mini-bar">';
  html += '<div class="analyze-mini-seg" style="background:var(--pos);width:' + s.pct['正面'] + '%"></div>';
  html += '<div class="analyze-mini-seg" style="background:var(--neu);width:' + s.pct['中性'] + '%"></div>';
  html += '<div class="analyze-mini-seg" style="background:var(--neg);width:' + s.pct['负面'] + '%"></div>';
  html += '</div>';
  html += '<div style="font-size:10px;color:var(--text-dim);margin-top:4px;">共分析 ' + t + ' 条，综合分 ' + (s.score_sum >= 0 ? '+' : '') + s.score_sum + '，均值 ' + s.score_avg + '</div>';
  el.innerHTML = html;
}

function loadStatsPanel() {
  fetch(API + '/stats?' + buildStatsParams()).then(function(res) { return res.json(); }).then(function(data) {
    var auto = data.auto || {};
    var locked = data.locked || {};
    var ac = data.auto_count || 0;
    var lc = data.locked_count || 0;
    var total = ac + lc;
    var posTotal = (auto['正面']||0)+(locked['正面']||0);
    var neuTotal = (auto['中性']||0)+(locked['中性']||0);
    var negTotal = (auto['负面']||0)+(locked['负面']||0);
    document.getElementById('statPos').textContent = posTotal + ' 条';
    document.getElementById('statNeu').textContent = neuTotal + ' 条';
    document.getElementById('statNeg').textContent = negTotal + ' 条';
    document.getElementById('statTotalCnt').textContent = total + ' 条';
    if (total > 0) {
      document.getElementById('statPosBar').style.width = (posTotal/total*100).toFixed(1) + '%';
      document.getElementById('statNeuBar').style.width = (neuTotal/total*100).toFixed(1) + '%';
      document.getElementById('statNegBar').style.width = (negTotal/total*100).toFixed(1) + '%';
    }
    var lw = data.like_weighted || {};
    var wp = lw['正面'] || 0;
    var wn = lw['负面'] || 0;
    var wne = lw['中性'] || 0;
    document.getElementById('weightedPos').style.width = wp + '%';
    document.getElementById('weightedPos').textContent = wp > 5 ? wp + '%' : '';
    document.getElementById('weightedNeu').style.width = wne + '%';
    document.getElementById('weightedNeu').textContent = wne > 5 ? wne + '%' : '';
    document.getElementById('weightedNeg').style.width = wn + '%';
    document.getElementById('weightedNeg').textContent = wn > 5 ? wn + '%' : '';
    document.getElementById('weightedPosVal').textContent = wp + '%';
    document.getElementById('weightedNeuVal').textContent = wne + '%';
    document.getElementById('weightedNegVal').textContent = wn + '%';
  });
  loadPlatformStats();
  loadTimeline();
}

function loadPlatformStats() {
  var baseParams = buildStatsParams();
  var platforms = ['bilibili', 'xueqiu', 'xiaohongshu'];
  var container = document.getElementById('platformBreakdown');
  var completed = 0;
  var totals = {};
  platforms.forEach(function(p) {
    fetch(API + '/comments?platform=' + encodeURIComponent(p) + '&' + baseParams + '&page=1&page_size=1').then(function(res) { return res.json(); }).then(function(data) {
      completed++;
      totals[p] = data.total || 0;
      if (completed === platforms.length) {
        var grandTotal = 0;
        platforms.forEach(function(p2) { grandTotal += totals[p2]; });
        var htmlFinal = '';
        platforms.forEach(function(p2) {
          var name = {bilibili:'B站', xueqiu:'雪球', xiaohongshu:'小红书'}[p2];
          var color = {bilibili:'var(--bili)', xueqiu:'var(--xueqiu)', xiaohongshu:'var(--xiaohongshu)'}[p2];
          var t = totals[p2];
          var width = grandTotal > 0 ? (t/grandTotal*100).toFixed(1) : 0;
          htmlFinal += '<div class="platform-stat">' +
            '<span class="platform-stat-name" style="color:' + color + '">' + name + '</span>' +
            '<div class="platform-stat-bar"><div class="platform-stat-fill" style="background:' + color + ';width:' + width + '%"></div></div>' +
            '<span class="platform-stat-count">' + t + '</span>' +
            '</div>';
        });
        container.innerHTML = htmlFinal;
      }
    });
  });
}

function loadComments() {
  var grid = document.getElementById('commentsGrid');
  grid.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';
  var params = 'page=' + state.page + '&page_size=' + state.pageSize +
    '&platform=' + encodeURIComponent(state.platform) +
    '&sentiment=' + encodeURIComponent(state.sentiment) +
    '&locked=' + encodeURIComponent(state.locked) +
    '&author=' + encodeURIComponent(state.author) +
    '&video_title=' + encodeURIComponent(state.video) +
    '&date_from=' + encodeURIComponent(state.dateFrom) +
    '&date_to=' + encodeURIComponent(state.dateTo);
  fetch(API + '/comments?' + params).then(function(res) { return res.json(); }).then(function(data) {
    window.currentComments = data;
    state.total = data.total;
    state.pages = data.pages;
    if (data.items.length === 0) {
      grid.innerHTML = '<div class="empty">没有找到符合条件的评论</div>';
      renderPagination();
      return;
    }
    var html = '';
    for (var i = 0; i < data.items.length; i++) {
      html += renderCard(data.items[i]);
    }
    grid.innerHTML = html;
    renderPagination();
  });
}

function renderCard(item) {
  var sentiment = item.sentiment || '中性';
  var isFixed = !!item.sentiment_fix;
  var displaySentiment = isFixed ? item.sentiment_fix : sentiment;
  var posClass = displaySentiment === '正面' ? 'pos' : displaySentiment === '负面' ? 'neg' : 'neu';
  var videoInfo = item.video_title || item.symbol ? '<span>' + esc(item.video_title || item.symbol) + '</span>' : '';
  var upInfo = item.up_name ? '<span>UP: ' + esc(item.up_name) + '</span>' : '';
  var authorInfo = item.author_name ? '<span>' + esc(item.author_name) + '</span>' : '';
  // Prefer created_at (real comment time) — only fall back to collected_at
  // (when we ingested the comment) when a real date exists there. Both
  // empty? Show a muted placeholder so the row layout stays consistent
  // and users can see "this card has no date info" instead of wondering
  // if the field is broken.
  var realDate = item.created_at || '';
  var displayDate = '';
  if (realDate) {
    // Format: handle both "YYYY-MM-DD HH:MM:SS" (local) and "YYYY-MM-DDTHH:MM:SS.sssZ" (ISO)
    var d;
    if (realDate.indexOf('T') !== -1) {
      // ISO format, convert to local time
      d = new Date(realDate);
      if (!isNaN(d.getTime())) {
        var y = d.getFullYear();
        var M = d.getMonth() + 1;
        var day = d.getDate();
        var h = d.getHours();
        var m = d.getMinutes();
        var s = d.getSeconds();
        displayDate = y + '-' + (M < 10 ? '0' : '') + M + '-' + (day < 10 ? '0' : '') + day + ' ' +
          (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
      } else {
        displayDate = realDate;
      }
    } else if (realDate.length >= 10) {
      // Already a local datetime string or just date
      displayDate = realDate;
    }
  }
  var dateInfo = displayDate
    ? '<span>📅 ' + esc(displayDate) + '</span>'
    : '<span class="card-meta-muted">📅 未知日期</span>';
  var lockSvg = '<svg viewBox="0 0 24 24" width="10" height="10" fill="currentColor"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>';
  var unlockBtn = isFixed ? '<button class="unlock-btn" onclick="event.stopPropagation();clearFix(' + item.id + ')">解除</button>' : '';
  var hasImage = item.local_image_path || item.original_url;
  var imageIndicator = hasImage
    ? '<div class="card-image-indicator"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>有图片</div>'
    : '';
  var cardHtml = '<div class="card" onclick="openDetailModal(' + item.id + ')">' +
    '<div class="card-header">' +
      '<span class="platform-badge ' + item.platform + '">' + platformName(item.platform) + '</span>' +
      '<span class="card-author">' + esc(item.author_name || '-') + '</span>' +
      '<span class="card-likes"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.093.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>' + (item.likes || 0) + '</span>' +
    '</div>' +
    '<div class="card-content">' + esc(item.content || '') + '</div>' +
    '<div class="card-meta">' + videoInfo + upInfo + authorInfo + dateInfo + '</div>' +
    imageIndicator +
    '<div class="sentiment-row" onclick="event.stopPropagation()">' +
      '<div class="sentiment-badge ' + posClass + '">' + (isFixed ? lockSvg : '') + displaySentiment + '</div>' +
      '<div class="sentiment-selector">' +
        '<button class="pos ' + (displaySentiment==='正面'?'selected':'') + '" onclick="setSentiment(' + item.id + ',\'正面\')">正面</button>' +
        '<button class="neu ' + (displaySentiment==='中性'?'selected':'') + '" onclick="setSentiment(' + item.id + ',\'中性\')">中性</button>' +
        '<button class="neg ' + (displaySentiment==='负面'?'selected':'') + '" onclick="setSentiment(' + item.id + ',\'负面\')">负面</button>' +
        unlockBtn +
        '<button class="card-delete" title="删除评论" onclick="askDelete(' + item.id + ')">删除</button>' +
      '</div>' +
    '</div></div>';
  return cardHtml;
}

function renderPagination() {
  var el = document.getElementById('pagination');
  if (state.pages <= 1) { el.innerHTML = ''; return; }
  var prev = state.page > 1 ? '<button onclick="goPage(' + (state.page - 1) + ')">上一页</button>' : '<button disabled>上一页</button>';
  var next = state.page < state.pages ? '<button onclick="goPage(' + (state.page + 1) + ')">下一页</button>' : '<button disabled>下一页</button>';
  el.innerHTML = prev + '<span class="page-info">第 ' + state.page + ' / ' + state.pages + ' 页，共 ' + state.total + ' 条</span>' + next;
}

function setSentiment(id, sentiment) {
  fetch(API + '/comments/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({sentiment_fix: sentiment}) })
    .then(function() { loadComments(); refreshStatsIfVisible(); });
}

function clearFix(id) {
  fetch(API + '/comments/' + id, { method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify({sentiment_fix: null}) })
    .then(function() { loadComments(); refreshStatsIfVisible(); });
}

var pendingDeleteId = null;
function askDelete(id) {
  pendingDeleteId = id;
  // Try to find the comment content for a clearer confirm message
  var card = document.querySelector('.card button.card-delete[onclick="askDelete(' + id + ')"]');
  var preview = '';
  if (card) {
    var content = card.closest('.card').querySelector('.card-content');
    if (content) preview = content.textContent.trim();
  }
  var truncated = preview.length > 60 ? preview.substring(0, 60) + '…' : preview;
  document.getElementById('confirmModalText').textContent =
    (truncated ? '评论内容：' + truncated + '\n\n' : '') + '确定要删除这条评论吗？此操作无法撤销。';
  document.getElementById('confirmOkBtn').disabled = false;
  document.getElementById('confirmOkBtn').textContent = '删除';
  document.getElementById('confirmModal').classList.add('open');
}

function closeConfirmModal() {
  document.getElementById('confirmModal').classList.remove('open');
  pendingDeleteId = null;
}

function confirmOk() {
  if (!pendingDeleteId) return;
  var id = pendingDeleteId;
  var btn = document.getElementById('confirmOkBtn');
  btn.disabled = true;
  btn.textContent = '删除中...';
  fetch(API + '/comments/' + id, { method: 'DELETE' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      closeConfirmModal();
      loadComments();
      refreshStatsIfVisible();
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = '删除';
      alert('删除失败：' + err.message);
    });
}

function setSentimentFilter(val) {
  state.sentiment = val;
  state.page = 1;
  var btns = document.querySelectorAll('[data-sentiment]');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    b.classList.remove('active', 'all', 'pos', 'neg', 'neu');
    if (b.dataset.sentiment === val) b.classList.add('active');
    if (val === '' && b.dataset.sentiment === '') b.classList.add('active', 'all');
    if (b.dataset.sentiment === '正面') b.classList.add('pos');
    if (b.dataset.sentiment === '负面') b.classList.add('neg');
    if (b.dataset.sentiment === '中性') b.classList.add('neu');
  }
  loadComments();
  refreshStatsIfVisible();
}

function setLockedFilter(val) {
  state.locked = val;
  state.page = 1;
  var btns = document.querySelectorAll('[data-locked]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove('active');
    if (btns[i].dataset.locked === val) btns[i].classList.add('active');
    if (val === '' && btns[i].dataset.locked === '') btns[i].classList.add('active');
  }
  loadComments();
}

function refreshStatsIfVisible() {
  loadStats();
  if (statsPanelVisible) {
    loadStatsPanel();
  }
}

function goPage(p) {
  state.page = p;
  loadComments();
  document.querySelector('.main').scrollTop = 0;
}

// Debounced version of loadComments — triggered by sidebar filter inputs
var debounceTimer = null;
function debounceLoad() {
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(function() {
    state.page = 1;
    loadComments();
    refreshStatsIfVisible();
  }, 250);
}

document.querySelectorAll('.platform-tabs button').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.platform-tabs button').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    state.platform = btn.dataset.platform;
    state.page = 1;
    loadComments();
    refreshStatsIfVisible();
  });
});

document.getElementById('authorFilter').addEventListener('input', function(e) { state.author = e.target.value; debounceLoad(); });
document.getElementById('videoFilter').addEventListener('input', function(e) { state.video = e.target.value; debounceLoad(); });
document.getElementById('likesFilter').addEventListener('input', function(e) { state.likes = parseInt(e.target.value) || 0; debounceLoad(); });
// ── Date picker (calendar + clock) ──
var dpState = { startY: 0, startM: 0, endY: 0, endM: 0 };

function dpPopulateSelects() {
  function opts(from, to) {
    var h = '';
    for (var i = from; i <= to; i++) {
      var v = i < 10 ? '0' + i : '' + i;
      h += '<option value="' + v + '">' + v + '</option>';
    }
    return h;
  }
  document.getElementById('dpStartHour').innerHTML = opts(0, 23);
  document.getElementById('dpStartMin').innerHTML = opts(0, 59);
  document.getElementById('dpEndHour').innerHTML = opts(0, 23);
  document.getElementById('dpEndMin').innerHTML = opts(0, 59);
}

function dpParseISO(s) {
  if (!s) return null;
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function dpToISO(d) {
  if (!d) return '';
  var y = d.getFullYear();
  var M = d.getMonth() + 1;
  var day = d.getDate();
  var h = d.getHours();
  var m = d.getMinutes();
  return y + '-' + (M < 10 ? '0' : '') + M + '-' + (day < 10 ? '0' : '') + day +
    'T' + (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}

function dpRender(side) {
  var isStart = side === 'start';
  var y = isStart ? dpState.startY : dpState.endY;
  var m = isStart ? dpState.startM : dpState.endM;
  var gridId = isStart ? 'dpStartGrid' : 'dpEndGrid';
  var labelId = isStart ? 'dpStartLabel' : 'dpEndLabel';
  var sel = isStart ? dpState.startD : dpState.endD;

  document.getElementById(labelId).textContent = y + '年' + (m + 1) + '月';

  var first = new Date(y, m, 1).getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var daysInPrev = new Date(y, m, 0).getDate();
  var html = '';
  var totalCells = Math.ceil((first + daysInMonth) / 7) * 7;

  for (var i = 0; i < totalCells; i++) {
    var dayNum, cls = 'datepicker-day';
    if (i < first) {
      dayNum = daysInPrev - first + i + 1;
      cls += ' other';
    } else if (i >= first + daysInMonth) {
      dayNum = i - first - daysInMonth + 1;
      cls += ' other';
    } else {
      dayNum = i - first + 1;
      var thisDate = new Date(y, m, dayNum);
      // Today highlight
      var today = new Date();
      if (dayNum === today.getDate() && m === today.getMonth() && y === today.getFullYear()) {
        cls += ' today';
      }
      // Selected highlight
      if (sel && dayNum === sel.getDate() && m === sel.getMonth() && y === sel.getFullYear()) {
        cls += ' selected';
      }
    }
    html += '<button class="' + cls + '" onclick="dpPickDay(' + dayNum + ',\'' + side + '\')">' + dayNum + '</button>';
  }
  document.getElementById(gridId).innerHTML = html;
}

function dpNav(dir, side) {
  if (side === 'start') {
    dpState.startM += dir;
    if (dpState.startM > 11) { dpState.startM = 0; dpState.startY++; }
    if (dpState.startM < 0) { dpState.startM = 11; dpState.startY--; }
    dpRender('start');
  } else {
    dpState.endM += dir;
    if (dpState.endM > 11) { dpState.endM = 0; dpState.endY++; }
    if (dpState.endM < 0) { dpState.endM = 11; dpState.endY--; }
    dpRender('end');
  }
}

function dpPickDay(day, side) {
  var isStart = side === 'start';
  var y = isStart ? dpState.startY : dpState.endY;
  var m = isStart ? dpState.startM : dpState.endM;
  var d = new Date(y, m, day,
    parseInt(document.getElementById(isStart ? 'dpStartHour' : 'dpEndHour').value),
    parseInt(document.getElementById(isStart ? 'dpStartMin' : 'dpEndMin').value));
  if (isStart) dpState.startD = d; else dpState.endD = d;
  dpRender(side);
}

function openDatePicker() {
  dpState.startD = dpParseISO(state.dateFrom);
  dpState.endD = dpParseISO(state.dateTo);
  var now = new Date();
  dpState.startY = dpState.startD ? dpState.startD.getFullYear() : now.getFullYear();
  dpState.startM = dpState.startD ? dpState.startD.getMonth() : now.getMonth();
  dpState.endY = dpState.endD ? dpState.endD.getFullYear() : now.getFullYear();
  dpState.endM = dpState.endD ? dpState.endD.getMonth() : now.getMonth();
  dpPopulateSelects();
  // Set hour/minute selects to saved values
  if (dpState.startD) {
    document.getElementById('dpStartHour').value = (dpState.startD.getHours() < 10 ? '0' : '') + dpState.startD.getHours();
    document.getElementById('dpStartMin').value = (dpState.startD.getMinutes() < 10 ? '0' : '') + dpState.startD.getMinutes();
  }
  if (dpState.endD) {
    document.getElementById('dpEndHour').value = (dpState.endD.getHours() < 10 ? '0' : '') + dpState.endD.getHours();
    document.getElementById('dpEndMin').value = (dpState.endD.getMinutes() < 10 ? '0' : '') + dpState.endD.getMinutes();
  }
  dpRender('start');
  dpRender('end');
  document.getElementById('datepickerModal').classList.add('open');
}

function closeDatePicker() {
  document.getElementById('datepickerModal').classList.remove('open');
}

function confirmDateRange() {
  // Capture current time selections
  if (dpState.startD) {
    dpState.startD.setHours(parseInt(document.getElementById('dpStartHour').value));
    dpState.startD.setMinutes(parseInt(document.getElementById('dpStartMin').value));
  }
  if (dpState.endD) {
    dpState.endD.setHours(parseInt(document.getElementById('dpEndHour').value));
    dpState.endD.setMinutes(parseInt(document.getElementById('dpEndMin').value));
  }
  state.dateFrom = dpToISO(dpState.startD);
  state.dateTo = dpToISO(dpState.endD);
  updateDateRangeLabel();
  closeDatePicker();
  state.page = 1;
  loadComments();
  refreshStatsIfVisible();
}

function clearDateRange() {
  dpState.startD = null;
  dpState.endD = null;
  var now = new Date();
  dpState.startY = now.getFullYear();
  dpState.startM = now.getMonth();
  dpState.endY = now.getFullYear();
  dpState.endM = now.getMonth();
  state.dateFrom = '';
  state.dateTo = '';
  updateDateRangeLabel();
  closeDatePicker();
  state.page = 1;
  loadComments();
  refreshStatsIfVisible();
}

function updateDateRangeLabel() {
  var el = document.getElementById('dateRangeLabel');
  if (state.dateFrom && state.dateTo) {
    // Short display: show date portion, hide time if both midnight
    var f = state.dateFrom.substring(0, 16);
    var t = state.dateTo.substring(0, 16);
    el.textContent = f + ' ~ ' + t;
  } else if (state.dateFrom) {
    el.textContent = state.dateFrom.substring(0, 16) + ' ~';
  } else if (state.dateTo) {
    el.textContent = '~ ' + state.dateTo.substring(0, 16);
  } else {
    el.textContent = '全部时间';
  }
}

function platformName(p) { return {bilibili:'B站', xueqiu:'雪球', xiaohongshu:'小红书'}[p] || p; }
function esc(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var currentDetailItem = null;

function openDetailModal(commentId) {
  // First check if we have the item in current loaded items
  var item = null;
  if (window.currentComments && window.currentComments.items) {
    for (var i = 0; i < window.currentComments.items.length; i++) {
      if (window.currentComments.items[i].id === commentId) {
        item = window.currentComments.items[i];
        break;
      }
    }
  }
  if (!item) {
    // If not, fetch from API
    fetch(API + '/comments/' + commentId)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        renderDetailModal(data);
      })
      .catch(function(err) {
        console.error('Failed to fetch comment:', err);
      });
  } else {
    renderDetailModal(item);
  }
}

function renderDetailModal(item) {
  currentDetailItem = item;
  var modal = document.getElementById('detailModal');
  var body = document.getElementById('detailModalBody');
  var footer = document.getElementById('detailModalFooter');
  var title = document.getElementById('detailModalTitle');

  title.textContent = platformName(item.platform) + ' - 评论详情';

  var sentiment = item.sentiment || '中性';
  var isFixed = !!item.sentiment_fix;
  var displaySentiment = isFixed ? item.sentiment_fix : sentiment;
  var posClass = displaySentiment === '正面' ? 'pos' : displaySentiment === '负面' ? 'neg' : 'neu';
  var lockSvg = '<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="display:inline-block;vertical-align:-2px;margin-right:4px;"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2z"/></svg>';

  // Image section
  var imageHtml = '';
  if (item.local_image_path) {
    imageHtml = '<img class="detail-image" src="/' + esc(item.local_image_path) + '" alt="评论图片" onerror="this.style.display=\'none\'"/>';
  } else if (item.original_url) {
    imageHtml = '<img class="detail-image" src="' + esc(item.original_url) + '" alt="评论图片" onerror="this.style.display=\'none\'"/>';
  }

  // Meta section
  var metaHtml = '<div class="detail-meta">';
  if (item.author_name) {
    metaHtml += '<div class="detail-meta-row"><span class="detail-meta-label">作者</span><span class="detail-meta-value">' + esc(item.author_name) + '</span></div>';
  }
  if (item.video_title) {
    metaHtml += '<div class="detail-meta-row"><span class="detail-meta-label">视频</span><span class="detail-meta-value">' + esc(item.video_title) + '</span></div>';
  }
  if (item.symbol) {
    metaHtml += '<div class="detail-meta-row"><span class="detail-meta-label">股票</span><span class="detail-meta-value">' + esc(item.symbol) + '</span></div>';
  }
  if (item.up_name) {
    metaHtml += '<div class="detail-meta-row"><span class="detail-meta-label">UP主</span><span class="detail-meta-value">' + esc(item.up_name) + '</span></div>';
  }
  if (item.created_at) {
    metaHtml += '<div class="detail-meta-row"><span class="detail-meta-label">时间</span><span class="detail-meta-value">' + esc(item.created_at) + '</span></div>';
  }
  metaHtml += '<div class="detail-meta-row"><span class="detail-meta-label">点赞</span><span class="detail-meta-value">' + (item.likes || 0) + '</span></div>';
  metaHtml += '</div>';

  body.innerHTML = imageHtml + '<div class="detail-content">' + esc(item.content || '') + '</div>' + metaHtml;

  // Footer with sentiment controls
  var unlockBtn = isFixed ? '<button class="unlock-btn" onclick="clearFix(' + item.id + ');refreshDetailModal()">解除</button>' : '';
  footer.innerHTML = '<div class="sentiment-row" style="margin:0;justify-content:space-between;">' +
    '<div class="sentiment-badge ' + posClass + '">' + (isFixed ? lockSvg : '') + displaySentiment + '</div>' +
    '<div class="sentiment-selector">' +
      '<button class="pos ' + (displaySentiment==='正面'?'selected':'') + '" onclick="setSentiment(' + item.id + ',\'正面\');refreshDetailModal()">正面</button>' +
      '<button class="neu ' + (displaySentiment==='中性'?'selected':'') + '" onclick="setSentiment(' + item.id + ',\'中性\');refreshDetailModal()">中性</button>' +
      '<button class="neg ' + (displaySentiment==='负面'?'selected':'') + '" onclick="setSentiment(' + item.id + ',\'负面\');refreshDetailModal()">负面</button>' +
      unlockBtn +
      '<button class="card-delete" title="删除评论" onclick="askDelete(' + item.id + ')">删除</button>' +
    '</div>' +
  '</div>';

  modal.classList.add('open');
}

function refreshDetailModal() {
  if (currentDetailItem) {
    // Refetch and re-render
    fetch(API + '/comments/' + currentDetailItem.id)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        currentDetailItem = data;
        renderDetailModal(data);
      })
      .catch(function(err) {
        console.error('Failed to refresh comment:', err);
      });
  }
}

function closeDetailModal() {
  document.getElementById('detailModal').classList.remove('open');
  currentDetailItem = null;
}

loadStats();
loadComments();
</script>
</body>
